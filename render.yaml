# Render blueprint — SokoOS (api + web).
# Database is external (Supabase Postgres), so there is no Render database block:
# paste the Supabase connection string into DATABASE_URL in the Render dashboard.
# Docs: https://render.com/docs/blueprint-spec
services:
  # ── API (NestJS, Fastify) ────────────────────────────────────────────────
  - type: web
    name: sokoos-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter @sokoos/shared build
      pnpm --filter @sokoos/api prisma:generate
      pnpm --filter @sokoos/api build
      pnpm --filter @sokoos/api prisma:migrate
    startCommand: pnpm --filter @sokoos/api start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase Postgres — the direct host (db.<ref>.supabase.co) needs IPv6;
      # if the Render runtime lacks it, use the Supabase session-pooler URL.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false          # same value as DATABASE_URL
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # Comma-separated allow-list (matches main.ts CORS).
      - key: FRONTEND_URL
        value: "https://soko.villacode.site,http://localhost:3000"
      - key: SMS_PROVIDER
        value: mock
      - key: WHATSAPP_PROVIDER
        value: mock
      # ── Email (SMTP — Resend) ───────────────────────────────────────────────
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false          # Resend API key — set in the Render dashboard, never commit it
      - key: EMAIL_FROM
        value: "SokoOS <no-reply@soko.villacode.site>"
      - key: SUPPORT_EMAIL
        value: jomodes765@gmail.com

  # ── Web (Next.js) ─────────────────────────────────────────────────────────
  - type: web
    name: sokoos-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter @sokoos/shared build
      pnpm --filter @sokoos/web build
    startCommand: pnpm --filter @sokoos/web start
    envVars:
      # Inlined into the client bundle at build time — must be the API's PUBLIC origin.
      - key: NEXT_PUBLIC_API_URL
        value: "https://sokoapi.villacode.site"
      - key: NEXT_PUBLIC_APP_URL
        value: "https://soko.villacode.site"
