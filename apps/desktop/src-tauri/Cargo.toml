[package]
name = "sokoos-desktop"
version = "0.0.1"
description = "SokoOS Desktop — Tauri 2 client for the SokoOS platform"
authors = ["SokoOS"]
edition = "2021"
rust-version = "1.77"

# The Tauri 2 template builds a library so the same code can be reused on mobile,
# with a thin binary in src/main.rs.
[lib]
name = "sokoos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
